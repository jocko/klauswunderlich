<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klaus Wunderlich — Hammond Player</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, serif; color: #fff; background: #020307; }
    .hero {
      min-height: 100vh;
      display: grid;
      place-items: end start;
      padding: clamp(2rem, 7vw, 6rem);
      background: #020307 url("hero.png") center / min(calc(100vw - 2rem), calc(100vh - 2rem), 56rem) no-repeat;
    }
    h1 { margin: 0; max-width: 12ch; font-size: clamp(3rem, 9vw, 8rem); line-height: .9; }
    p { margin: 1rem 0 0; font-size: clamp(1rem, 2vw, 1.35rem); }
  </style>
</head>
<body>
  <main class="hero">
    <div>
      <h1>Klaus Wunderlich</h1>
      <p>Nu e de den biggest!</p>
    </div>
  </main>
</body>
</html>
